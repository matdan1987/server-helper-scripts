name: Build Kimi Claw Check APK

on:
  push:
    branches:
      - kimi-claw-check-android
    paths:
      - 'kimi-check/**'
      - '.github/workflows/kimi-claw-check-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Android Platform 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build real Android APK
        run: gradle --no-daemon -p kimi-check :app:assembleDebug
      - name: Validate APK ZIP structure and fingerprint
        run: |
          test -s kimi-check/app/build/outputs/apk/debug/app-debug.apk
          unzip -t kimi-check/app/build/outputs/apk/debug/app-debug.apk
          sha256sum kimi-check/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Kimi-Claw-Check-v1.2
          path: kimi-check/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
